joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

mecanum_base_controller:
  ros__parameters:
    type: mecanum_drive_controller/MecanumDriveController

    reference_timeout: 5.0

    # Wheel Joint definitions
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"

    kinematics:
      wheels_radius: 0.0325
      base_frame_offset: { x: -0.00605, y: 0.0, theta: 0.0 }
      sum_of_robot_center_projection_on_X_Y_axis: 0.224201

    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.max_velocity: 0.15
    linear.x.min_velocity: -0.15
    linear.x.max_acceleration: 0.25
    linear.x.max_deceleration: -0.35

    linear.y.max_velocity: 0.15
    linear.y.min_velocity: -0.15
    linear.y.max_acceleration: 0.25
    linear.y.max_deceleration: -0.35

    angular.z.max_velocity: 1.4
    angular.z.min_velocity: -1.4
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.5

gpio_command_controller:
  ros__parameters:
    type: gpio_controllers/GpioCommandController
    gpios:
      - dock_sensor
    state_interfaces:
          dock_sensor:
            - interfaces:
              - has_package